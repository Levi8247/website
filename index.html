<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éclat Botanique — Beleza &amp; Cuidados Botânicos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --surface-alt: #F2ECE1;
      --ink: #1E1A17;
      --muted: #6B625B;
      --accent: #9E5A43;
      --accent-dark: #7D4330;
      --sage: #4F6353;
      --border: #E6DDD0;
      --radius: 14px;
      --shadow: 0 12px 32px rgba(30, 26, 23, 0.06);
      --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .brand-logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      line-height: 1.15;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Top Announcement Bar */
    .announcement {
      background: var(--ink);
      color: var(--bg);
      text-align: center;
      font-size: 0.82rem;
      padding: 0.55rem 1rem;
      letter-spacing: 0.03em;
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(250, 247, 242, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0.95rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-logo {
      font-size: 1.75rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .brand-logo span {
      color: var(--accent);
      font-style: italic;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted);
      transition: var(--transition);
    }

    .nav-btn:hover {
      color: var(--ink);
      background: var(--surface-alt);
    }

    .nav-btn.active {
      background: var(--ink);
      color: #FFFFFF;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .cart-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.05rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--ink);
      transition: var(--transition);
    }

    .cart-btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .cart-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 0.35rem;
    }

    .menu-toggle {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    /* Pages */
    .page {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4.5rem;
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #FFFFFF;
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.92rem;
      transition: var(--transition);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.92rem;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      border-color: var(--ink);
      background: var(--surface-alt);
    }

    /* Hero (Home) */
    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 2.5rem;
      align-items: center;
      padding: 2.5rem 0 3.5rem;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--sage);
      margin-bottom: 0.85rem;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 5vw, 4.1rem);
      margin-bottom: 1.1rem;
      color: var(--ink);
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 540px;
      margin-bottom: 1.75rem;
    }

    .hero-actions {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .hero-card {
      background: linear-gradient(145deg, #EADFD0 0%, #D6C3AE 100%);
      border-radius: 24px;
      padding: 2.5rem;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero-pill {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.85)
    }
